apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  name: tests
spec:
  application: simple-python-app
  contexts:
    - description: Integration tests
      name: application
  resolverRef:
    resolver: git
    resourceKind: pipeline
    params:
      - name: url
        value: https://gitcode.com/qicx/simple-python-app
      - name: revision
        value: main
      - name: pathInRepo
        value: integration-tests/pipeline.yaml
