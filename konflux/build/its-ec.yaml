apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  annotations:
    test.appstudio.openshift.io/kind: enterprise-contract
  name: simple-python-app-enterprise-contract
spec:
  application: simple-python-app
  params:
    # Conforma searches this default policy from tenant namespace.
    - name: POLICY_CONFIGURATION
      value: default
  resolverRef:
    resourceKind: pipeline
    resolver: git
    params:
    - name: url
      value: https://gitcode.com/qicx/build-definitions
    - name: revision
      value: main
    - name: pathInRepo
      value: pipelines/enterprise-contract.yaml
